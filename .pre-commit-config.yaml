---
# Assembled by standards/tools/adopt_standards.py from
# enforcement/pre-commit/fragments/ at wrbell/standards@0fe6a29de0f22af075ba51fafff9e03d1238d54d.
# Repo-specific hooks may follow; a re-run only appends missing hooks.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: check-yaml
      - id: check-added-large-files
        args:
          - --maxkb=10240
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: '\.(yaml|yml)$'
        args:
          - -c
          - enforcement/yamllint/.yamllint.yml
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args:
          - --config
          - enforcement/markdownlint/.markdownlint-cli2.yaml
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.19.1
    hooks:
      - id: cspell
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --gitignore
          - --config
          - enforcement/cspell/cspell.json
          - --files
        stages:
          - manual
  - repo: local
    hooks:
      - id: check-docs
        name: check docs structure
        entry: python3 tools/check_docs.py
        language: system
        pass_filenames: false
        files: '^(README\.md|docs/decisions/.+\.md|templates/README\.template\.md)$'
      - id: agents-md-lint
        name: 'Check AGENTS.md, CLAUDE.md, and Cursor rules'
        entry: python3 tools/agents_md_lint.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages:
          - commit-msg
        additional_dependencies:
          - '@commitlint/config-conventional@21.2.3'
        args:
          - --config
          - enforcement/commitlint/commitlint.config.js
